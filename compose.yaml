# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
      args:
        # Only sets the EXPOSE/default; the runtime value comes from `environment` below.
        PORT: ${PORT:?set PORT in .env (see .env.example)}
    # Everything in .env reaches the container (DATABASE_URL, LOG_FORMAT, CORS_ORIGIN...).
    # The image itself never gets it: .env is in .dockerignore, so it stays out of the
    # build context and is injected only at run time.
    env_file:
      - .env
    # `environment` wins over `env_file`, so these override what .env sets.
    environment:
      NODE_ENV: production
      # PORT comes from the .env file in this directory (Compose loads it automatically),
      # src/api.js reads it via process.env.PORT.
      PORT: ${PORT:?set PORT in .env (see .env.example)}
      # Override the app's `localhost` default so the container listens on all interfaces
      # and the published port below actually reaches it.
      HOST: 0.0.0.0
      # Same override reason: the DATABASE_URL in .env points at localhost, which inside
      # this container is the container itself. `db` is the service name below, resolved
      # on the Compose network, and the port is the container's own 5432 regardless of
      # what the database is published as on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}

      # Same override reason: `localhost` in .env is the host; on the Compose network MinIO
      # is the `minio` service, on its container port.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:?set MINIO_DOCUMENTS_BUCKET in .env (see .env.example)}
    ports:
      - "${PORT:?set PORT in .env (see .env.example)}:${PORT:?set PORT in .env (see .env.example)}"
    # Wait for the healthchecks, not just for the containers to exist: main.js opens the pool
    # and checks the bucket at once, and refuses to start if either is missing.
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # File content, keyed by SHA-256 (src/access/primitives/minioStorage.js). One server over four
  # disks: MinIO erasure-codes across them, which is why the database records no placement.
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-07T08-39-31Z
    restart: unless-stopped
    command: ["minio", "server", "/data1", "/data2", "/data3", "/data4",
              "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
    volumes:
      - ${MINIO_DISK1:?set MINIO_DISK1 in .env (see .env.example)}:/data1
      - ${MINIO_DISK2:?set MINIO_DISK2 in .env (see .env.example)}:/data2
      - ${MINIO_DISK3:?set MINIO_DISK3 in .env (see .env.example)}:/data3
      - ${MINIO_DISK4:?set MINIO_DISK4 in .env (see .env.example)}:/data4
      - ${MINIO_LICENSE:?set MINIO_LICENSE in .env (see .env.example)}:/minio.license:ro
    # The API port is published so `npm run dev` and `npm test` on the host can reach it; the
    # console is the web UI.
    ports:
      - "${MINIO_API_PORT:?set MINIO_API_PORT in .env (see .env.example)}:9000"
      - "${MINIO_CONSOLE_PORT:?set MINIO_CONSOLE_PORT in .env (see .env.example)}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Runs once and exits: creates the documents bucket if it is missing (minio/init/setup.sh).
  minio-init:
    image: quay.io/minio/aistor/mc:RELEASE.2026-09-06T02-44-40Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:?set MINIO_DOCUMENTS_BUCKET in .env (see .env.example)}
    volumes:
      - ./minio/init/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]

  db:
    image: postgres:${POSTGRES_VERSION:?set POSTGRES_VERSION in .env (see .env.example)}-alpine
    restart: unless-stopped
    user: postgres
    # Nothing in this file has a `:-` default. A fallback lets a missing or misspelled
    # variable resolve to something plausible and start anyway, which is how a wrong
    # value goes unnoticed. `:?` makes Compose refuse and name the variable, so .env is
    # the single source of truth for every value here.
    #
    # Caveat this does NOT cover: Postgres reads POSTGRES_USER/PASSWORD/DB only when it
    # initialises an empty data directory. Once db-data exists, changing them in .env
    # has no effect and the old credentials stay live. Use `docker compose down -v` to
    # re-initialise, which also deletes the data.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      # Postgres 18 declares its volume at /var/lib/postgresql (PGDATA is the versioned
      # subdirectory below it), not the /var/lib/postgresql/data of earlier images.
      - db-data:/var/lib/postgresql
    # Published so host-side tooling can reach it: node-pg-migrate is a devDependency and
    # is not installed in the server image, so `npm run migrate:up` runs from your machine
    # against the DATABASE_URL in .env. Change POSTGRES_PORT if 5432 is already taken.
    ports:
      - "${POSTGRES_PORT:?set POSTGRES_PORT in .env (see .env.example)}:5432"
    # psql, not pg_isready: pg_isready only asks whether the postmaster is accepting
    # connections, so it reports healthy even when POSTGRES_USER names a role that does
    # not exist - which is exactly what happens when .env changes after db-data was
    # initialised. Actually selecting as that role makes the mismatch fail here, instead
    # of later and less clearly in the server container.
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)} -d ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)} -c 'select 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s


  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env (see .env.example)}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env (see .env.example)}
    # Its own variable, not POSTGRES_PORT: that one is already 5432 for the database,
    # and reusing it would publish two services on the same host port. The container
    # side is 80 because that is what pgadmin4 listens on internally.
    ports:
      - "${PGADMIN_PORT:?set PGADMIN_PORT in .env (see .env.example)}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    # The service is called `db`, not `postgres`. Waiting on the healthcheck also means
    # pgadmin does not come up pointing at a database that is not accepting connections.
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  pgadmin-data:

